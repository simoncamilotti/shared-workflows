name: Nx CI

on:
  workflow_call:
    inputs:
      node_version:
        description: 'Node.js version'
        type: string
        default: '24'
      nx_targets:
        description: 'Nx targets to run (space-separated)'
        type: string
        default: 'lint test build'
      prisma:
        description: 'Run prisma generate before targets'
        type: boolean
        default: false
      env_file:
        description: 'Content to write to .env file'
        type: string
        default: ''
      runner:
        description: 'Runner label (ubuntu-latest or a self-hosted scale set, e.g. equistabl-runners)'
        type: string
        default: 'ubuntu-latest'

permissions:
  actions: read
  contents: read

jobs:
  ci:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 0

      # The lockfile picks the package manager: npm projects keep working unchanged.
      - name: Detect package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then
            {
              echo "name=pnpm"
              echo "install=pnpm install --frozen-lockfile"
              echo "exec=pnpm exec"
            } >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then
            {
              echo "name=npm"
              echo "install=npm ci"
              echo "exec=npx"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::error::No pnpm-lock.yaml or package-lock.json at the repository root"
            exit 1
          fi

      # No version input: the action reads the packageManager field of package.json.
      - name: Setup pnpm
        if: steps.pm.outputs.name == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ steps.pm.outputs.name }}

      - run: ${{ steps.pm.outputs.install }}

      - name: Create env file
        if: inputs.env_file != ''
        env:
          ENV_CONTENT: ${{ inputs.env_file }}
        run: echo "$ENV_CONTENT" >> .env

      - name: Generate Prisma Client
        if: inputs.prisma
        run: ${{ steps.pm.outputs.exec }} prisma generate

      - name: Run Nx targets
        run: ${{ steps.pm.outputs.exec }} nx run-many -t ${{ inputs.nx_targets }}
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

      - name: Nx fix-ci
        run: ${{ steps.pm.outputs.exec }} nx fix-ci
        if: always()
