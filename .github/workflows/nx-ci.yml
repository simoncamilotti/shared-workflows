name: Nx CI

on:
  workflow_call:
    inputs:
      node_version:
        description: 'Node.js version'
        type: string
        default: '24'
      nx_targets:
        description: 'Nx targets to run (space-separated)'
        type: string
        default: 'lint test build'
      prisma:
        description: 'Run prisma generate before targets'
        type: boolean
        default: false
      env_file:
        description: 'Content to write to .env file'
        type: string
        default: ''
      runner:
        description: 'Runner label (ubuntu-latest or a self-hosted scale set, e.g. equistabl-runners)'
        type: string
        default: 'ubuntu-latest'
      affected:
        description: 'On pull requests, run the targets of the affected projects only (nx affected). Other events run every project.'
        type: boolean
        default: false
      knip:
        description: 'Run knip (unused files, dependencies and exports) after the Nx targets'
        type: boolean
        default: false
      gitleaks:
        description: 'Scan the git history for secrets with gitleaks'
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  ci:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 0

      # Free alternative to GitHub secret scanning, which is paid on private repositories.
      - name: Scan for secrets
        if: inputs.gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .

      # The lockfile picks the package manager: npm projects keep working unchanged.
      - name: Detect package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then
            {
              echo "name=pnpm"
              echo "install=pnpm install --frozen-lockfile"
              echo "exec=pnpm exec"
            } >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then
            {
              echo "name=npm"
              echo "install=npm ci"
              echo "exec=npx"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::error::No pnpm-lock.yaml or package-lock.json at the repository root"
            exit 1
          fi

      # No version input: the action reads the packageManager field of package.json.
      - name: Setup pnpm
        if: steps.pm.outputs.name == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ steps.pm.outputs.name }}

      - run: ${{ steps.pm.outputs.install }}

      - name: Create env file
        if: inputs.env_file != ''
        env:
          ENV_CONTENT: ${{ inputs.env_file }}
        run: echo "$ENV_CONTENT" >> .env

      - name: Generate Prisma Client
        if: inputs.prisma
        run: ${{ steps.pm.outputs.exec }} prisma generate

      # Base and head of the change, read by `nx affected` through NX_BASE and NX_HEAD.
      - name: Derive the affected range
        if: inputs.affected && github.event_name == 'pull_request'
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - name: Run Nx targets
        run: |
          if [ "$AFFECTED" = "true" ] && [ "$EVENT" = "pull_request" ]; then
            ${{ steps.pm.outputs.exec }} nx affected -t ${{ inputs.nx_targets }}
          else
            ${{ steps.pm.outputs.exec }} nx run-many -t ${{ inputs.nx_targets }}
          fi
        env:
          AFFECTED: ${{ inputs.affected }}
          EVENT: ${{ github.event_name }}
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

      - name: Check unused code and dependencies
        if: inputs.knip
        run: ${{ steps.pm.outputs.exec }} knip

      - name: Nx fix-ci
        run: ${{ steps.pm.outputs.exec }} nx fix-ci
        if: always()
