name: Docker Build & Deploy

on:
  workflow_call:
    inputs:
      images:
        description: 'JSON array of images to build, e.g. [{"name":"api","dockerfile":"apps/api/Dockerfile"}]'
        type: string
        required: true
      runner:
        description: 'Runner label for the build job (ubuntu-latest or a self-hosted scale set)'
        type: string
        default: 'ubuntu-latest'
      remote_buildkit:
        description: 'Build via a remote in-cluster BuildKit (buildx driver=remote, mTLS). Requires the runner pod to mount the client cert at /certs/buildkit.'
        type: boolean
        default: false
      buildkit_endpoint:
        description: 'Remote BuildKit endpoint, used when remote_buildkit=true'
        type: string
        default: 'tcp://buildkitd.buildkit.svc.cluster.local:1234'

jobs:
  build:
    if: vars.DOCKER_MANUAL_ONLY != 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: ${{ fromJson(inputs.images) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Remote driver : buildx pilote le BuildKit in-cluster en mTLS (certs montés
      # dans le pod runner par le scale set ARC). Aucun daemon Docker local requis.
      - name: Set up Docker Buildx (remote in-cluster BuildKit)
        if: inputs.remote_buildkit
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: remote
          endpoint: ${{ inputs.buildkit_endpoint }}
          driver-opts: |
            cacert=/certs/buildkit/ca.crt
            cert=/certs/buildkit/tls.crt
            key=/certs/buildkit/tls.key

      - name: Set up Docker Buildx
        if: ${{ !inputs.remote_buildkit }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repo name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ env.REPO }}/${{ matrix.image.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=raw,value=${{ github.ref_name }}-${{ github.run_id }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit distant : on s'appuie sur le cache LOCAL de buildkitd
          # (persistant sur PVC) -> pas de cache registre. L'export mode=max vers
          # ghcr via WAN coûtait ~18 min/build, bien plus que le bénéfice.
          # Sinon (ubuntu-latest) : cache GHA classique.
          cache-from: ${{ inputs.remote_buildkit && '' || 'type=gha' }}
          cache-to: ${{ inputs.remote_buildkit && '' || 'type=gha,mode=max' }}

  deploy-dev:
    runs-on: ${{ inputs.runner }}
    if: github.ref == 'refs/heads/main'
    needs: build
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3.0.0

      - name: Update image tags
        working-directory: gitops/apps/${{ github.event.repository.name }}/overlays/dev
        env:
          IMAGES: ${{ inputs.images }}
        run: |
          TAG="${GITHUB_REF_NAME}-${GITHUB_RUN_ID}"
          REPO="${GITHUB_REPOSITORY,,}"
          CMD="kustomize edit set image"
          for IMAGE in $(echo "$IMAGES" | jq -r '.[].name'); do
            CMD="$CMD ghcr.io/${REPO}/${IMAGE}=ghcr.io/${REPO}/${IMAGE}:${TAG}"
          done
          eval $CMD

      - name: Commit and push
        working-directory: gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "deploy(dev): ${{ github.event.repository.name }} images to ${GITHUB_REF_NAME}-${GITHUB_RUN_ID}"
          git push

      - name: Notify Slack
        if: success()
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ github.event.repository.name }} deployed to dev :rocket:",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*${{ github.event.repository.name }} deployed to dev* :rocket:\nTag `${{ github.ref_name }}-${{ github.run_id }}` pushed to GitOps (dev overlay).\nContains `${{ github.event.head_commit.message }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow>"
                  }
                }
              ]
            }

  deploy-prod:
    runs-on: ${{ inputs.runner }}
    if: github.event_name == 'release'
    needs: build
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3.0.0

      - name: Update image tags
        working-directory: gitops/apps/${{ github.event.repository.name }}/overlays/prod
        env:
          IMAGES: ${{ inputs.images }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          REPO="${GITHUB_REPOSITORY,,}"
          CMD="kustomize edit set image"
          for IMAGE in $(echo "$IMAGES" | jq -r '.[].name'); do
            CMD="$CMD ghcr.io/${REPO}/${IMAGE}=ghcr.io/${REPO}/${IMAGE}:${VERSION}"
          done
          eval $CMD

      - name: Commit and push
        working-directory: gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "deploy(prod): ${{ github.event.repository.name }} images to ${GITHUB_REF_NAME}"
          git push

      - name: Notify Slack
        if: success()
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ github.event.repository.name }} deployed to prod :white_check_mark:",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*${{ github.event.repository.name }} deployed to prod* :white_check_mark:\nVersion `${{ github.ref_name }}` pushed to GitOps (prod overlay).\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow>"
                  }
                }
              ]
            }
